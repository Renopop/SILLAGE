[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sillage"
version = "0.4.0"   # = sillage/version.py (source unique) — voir CHANGELOG.md
description = "Spécifications, Incomplétudes, Livrables : Lecture, Analyse et Grille des Écarts"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Renaud Loison" }]

# Les dépendances du moteur de RIVAGE embarqué (sillage/moteur/) sont incluses.
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pdfminer.six>=20221105",
    "pymupdf>=1.24",
    "unidecode>=1.3",
    "python-pptx>=0.6.23",
    "xlrd>=2.0",
    "pandas>=2.0",
    "psutil>=5.9",
    "faiss-cpu>=1.8",
    'pywin32>=306; sys_platform == "win32"',
]

[project.optional-dependencies]
accel = ["langchain-text-splitters>=0.2", "datasketch>=1.6", "rank-bm25>=0.2"]
test = ["pytest>=7.0"]

[project.scripts]
sillage = "sillage.cli:main"

[tool.setuptools]
packages = ["sillage", "sillage.moteur"]

[tool.setuptools.package-data]
"sillage.moteur" = ["VERSION_RIVAGE.txt", "hooks/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
