[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sillage"
version = "0.2.0"   # = sillage/version.py (source unique) — voir CHANGELOG.md
description = "Spécifications, Incomplétudes, Livrables : Lecture, Analyse et Grille des Écarts"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Renaud Loison" }]

dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
sillage = "sillage.cli:main"

[tool.setuptools]
packages = ["sillage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
